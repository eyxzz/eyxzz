name: contribution-fx

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution SVG
        uses: Sur1ive/contribution-fx@main
        with:
          username: eyxzz
          theme: ripple
          palette: purple
          mode: light
          out-dir: dist

      - name: Recolor SVG to lavender/purple
        run: |
          sed -i 's/#9be9a8/#e9d5ff/g; s/#40c463/#c084fc/g; s/#30a14e/#9333ea/g; s/#216e39/#6b21a8/g' dist/contribution-fx.svg

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}